<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI','Yu Gothic',sans-serif;fill:#111827}
      .head{font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Yu Gothic',sans-serif;fill:#111827}
      .text{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Yu Gothic',sans-serif;fill:#4b5563}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:2}
      .accent{fill:#f8fafc;stroke:#475569;stroke-width:2}
      .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1500" height="620" fill="#ffffff"/>
  <text x="60" y="62" class="title">Technical Document Review Demo</text>

  <rect x="60" y="150" width="220" height="220" rx="18" class="box"/>
  <text x="92" y="198" class="head">Documents</text>
  <text x="92" y="238" class="text">Project Summary</text>
  <text x="92" y="270" class="text">Measurement Report</text>
  <text x="92" y="302" class="text">Inspection Record</text>
  <text x="92" y="334" class="text">Acceptance Conclusion</text>

  <rect x="345" y="150" width="220" height="220" rx="18" class="box"/>
  <text x="380" y="198" class="head">Normalize</text>
  <text x="380" y="246" class="text">case_id</text>
  <text x="380" y="278" class="text">asset_id</text>
  <text x="380" y="310" class="text">common fields</text>

  <rect x="630" y="150" width="220" height="220" rx="18" class="accent"/>
  <text x="663" y="198" class="head">Compare</text>
  <text x="663" y="246" class="text">same asset</text>
  <text x="663" y="278" class="text">same field</text>
  <text x="663" y="310" class="text">different values</text>

  <rect x="915" y="150" width="220" height="220" rx="18" class="box"/>
  <text x="948" y="198" class="head">Finding</text>
  <text x="948" y="246" class="text">needs_review</text>
  <text x="948" y="278" class="text">Evidence[]</text>
  <text x="948" y="310" class="text">source trace</text>

  <rect x="1200" y="150" width="220" height="220" rx="18" class="box"/>
  <text x="1233" y="198" class="head">Human Review</text>
  <text x="1233" y="246" class="text">inspect evidence</text>
  <text x="1233" y="278" class="text">confirm / reject</text>
  <text x="1233" y="310" class="text">final responsibility</text>

  <path d="M280 260 L345 260" class="arrow"/>
  <path d="M565 260 L630 260" class="arrow"/>
  <path d="M850 260 L915 260" class="arrow"/>
  <path d="M1135 260 L1200 260" class="arrow"/>

  <text x="60" y="470" class="head">Public boundary</text>
  <text x="60" y="505" class="text">Rule internals / Prompt / Agent orchestration / MCP topology / production APIs are intentionally not included.</text>
</svg>
